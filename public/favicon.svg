<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0A2540" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#2563EB" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Stylized Truck Cab & Dry Van Trailer -->
  <g fill="#FFFFFF" transform="translate(7, 10) scale(0.78)">
    <!-- Trailer -->
    <rect x="2" y="6" width="34" height="24" rx="2" fill="#E2E8F0" />
    <line x1="8" y1="6" x2="8" y2="30" stroke="#94A3B8" stroke-width="1" />
    <line x1="16" y1="6" x2="16" y2="30" stroke="#94A3B8" stroke-width="1" />
    <line x1="24" y1="6" x2="24" y2="30" stroke="#94A3B8" stroke-width="1" />
    <line x1="32" y1="6" x2="32" y2="30" stroke="#94A3B8" stroke-width="1" />
    
    <!-- Truck Cab -->
    <path d="M37 13 L47 13 L54 21 L54 30 L37 30 Z" fill="#2563EB" />
    <!-- Cab Window -->
    <path d="M46 15 L39 15 L39 21 L50 21 Z" fill="#93C5FD" />
    <!-- Grill / Bumper -->
    <rect x="52" y="25" width="4" height="5" rx="1" fill="#CBD5E1" />
    
    <!-- Wheels -->
    <circle cx="8" cy="31" r="4" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="16" cy="31" r="4" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="44" cy="31" r="4" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="51" cy="31" r="4" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- MMD Typography in White & Blue Glow -->
  <text x="32" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">MMD</text>
</svg>
